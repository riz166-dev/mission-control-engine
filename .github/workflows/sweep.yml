name: Mission Control Autonomous Sweep

on:
  schedule:
    # 8:30 AM CT (13:30 UTC daylight / 14:30 UTC standard) Mon-Fri
    - cron: '30 13 * * 1-5'
    # 3:00 PM CT (20:00 UTC daylight / 21:00 UTC standard) Mon-Fri
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Allows 1-click manual test runs

jobs:
  sweep-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Execute Discovery & Push
        env:
          GSHEET_WEBAPP_URL: ${{ secrets.GSHEET_WEBAPP_URL }}
          GSHEET_TOKEN: ${{ secrets.GSHEET_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run_sweep.py
